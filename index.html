        async function generateAndAddContactSheet(){
            try {
                // Don't change status - this runs in background

                // Remove existing contact sheet if present
                const contactSheetIndex=state.photos.findIndex(p=>p.isContactSheet);
                if(contactSheetIndex!==-1){
                    state.photos.splice(contactSheetIndex,1);
                }

                // Get only actual photos (not videos, not existing contact sheets)
                const photos=state.photos.filter(p=>!p.isContactSheet);
                if(photos.length===0){
                    return;
                }

            // Calculate available canvas dimensions
            const canvasContainer=document.getElementById('canvasContainer');
            const displayWidth=window.innerWidth-30; // 15px padding each side
            const displayHeight=window.innerHeight-340-30; // nav+footer+padding

            // Scale factor for high resolution (3x for retina quality)
            const scale=3;

            // Target aspect ratio is 4:5 (width:height) - always maintain this
            const targetAspect=4/5;
            const displayAspect=displayWidth/displayHeight;

            let sheetDisplayW, sheetDisplayH;
            if(displayAspect > targetAspect){
                // Height constrained - use full height
                sheetDisplayH=displayHeight;
                sheetDisplayW=sheetDisplayH*targetAspect;
            }else{
                // Width constrained - use full width
                sheetDisplayW=displayWidth;
                sheetDisplayH=sheetDisplayW/targetAspect;
            }

            // Apply scale for high resolution (always 4:5 ratio)
            const sheetW=Math.floor(sheetDisplayW*scale);
            const sheetH=Math.floor(sheetDisplayH*scale);

            // Now calculate grid layout to fit within this fixed 4:5 size
            const padding=8*scale;
            const margin=20*scale;
            const logoHeight=40*scale;
            const labelHeight=24*scale;

            // Determine optimal columns based on photo count
            let cols=Math.min(Math.max(3,Math.floor(displayWidth/150)),6); // 3-6 columns
            if(photos.length<=3)cols=3;
            else if(photos.length<=8)cols=4;
            else if(photos.length<=15)cols=5;
            else cols=6;

            const rows=Math.ceil(photos.length/cols);

            // Calculate available space for grid
            const availableGridWidth=sheetW-margin*2;
            const availableGridHeight=sheetH-margin*2-logoHeight-padding;

            // Calculate thumb size based on columns and available width
            const thumbSizeByWidth=Math.floor((availableGridWidth-padding*(cols-1))/cols);

            // Calculate thumb size based on rows and available height
            const availableHeightForThumbs=availableGridHeight-rows*labelHeight-(rows-1)*padding;
            const thumbSizeByHeight=Math.floor(availableHeightForThumbs/rows);

            // Use the smaller of the two to ensure it fits within the 4:5 canvas
            const thumbSize=Math.min(thumbSizeByWidth, thumbSizeByHeight);

            const sheet=document.createElement('canvas');
            sheet.width=sheetW;
            sheet.height=sheetH;
            const sctx=sheet.getContext('2d',{alpha:false});

            sctx.fillStyle='#000';
            sctx.fillRect(0,0,sheetW,sheetH);

            // Draw logo at top left
            const logoImg=new Image();
            logoImg.src='logo.svg';
            await new Promise(resolve=>{
                logoImg.onload=()=>{
                    const actualAspect=logoImg.width/logoImg.height;
                    const logoH=logoHeight-6*scale;
                    const logoW=logoH*actualAspect;
                    sctx.drawImage(logoImg,margin+5*scale,margin+5*scale,logoW,logoH);
                    resolve();
                };
            });

            // Draw grid of photos with effects
            let photoIndex=0;
            for(let row=0;row<rows;row++){
                for(let col=0;col<cols;col++){
                    const x=margin+col*(thumbSize+padding);
                    const y=margin+logoHeight+padding+row*(thumbSize+labelHeight+padding);

                    if(photoIndex<photos.length){
                        const p=photos[photoIndex];
                        const sourceImg=p.original||p.image;
                        const aspectRatio=sourceImg.width/sourceImg.height;

                        // Calculate display size
                        let drawW=thumbSize;
                        let drawH=thumbSize;
                        if(aspectRatio>1){
                            drawH=thumbSize/aspectRatio;
                        }else{
                            drawW=thumbSize*aspectRatio;
                        }

                        // Scale down FIRST to thumbnail size (much faster!)
                        const tempCanvas=document.createElement('canvas');
                        const tctx=tempCanvas.getContext('2d',{alpha:false,willReadFrequently:true});
                        tempCanvas.width=Math.floor(drawW);
                        tempCanvas.height=Math.floor(drawH);
                        tctx.drawImage(sourceImg,0,0,tempCanvas.width,tempCanvas.height);

                        // Apply effects to small thumbnail (not full res!)
                        const savedSettings=state.settings;
                        state.settings=p.settings;
                        // CRITICAL: Preload LUT for this photo's profile
                        await preloadLUTForProfile(p.settings.profile);
                        applyEffects(tctx,tempCanvas.width,tempCanvas.height);

                        // Apply film border if enabled (then scale down to fit)
                        if(p.settings.filmBorder){
                            await applyFilmBorder(tempCanvas,tctx,p.settings,{
                                ...p,
                                frameNumber:photoIndex+1,
                                uploadTime:p.uploadTime||new Date()
                            });

                            // Border changed canvas size - need to scale back down to fit thumbnail
                            const borderedW=tempCanvas.width;
                            const borderedH=tempCanvas.height;
                            const borderedAspect=borderedW/borderedH;

                            // Calculate new thumbnail size to fit
                            if(borderedAspect>1){
                                drawH=thumbSize/borderedAspect;
                                drawW=thumbSize;
                            }else{
                                drawW=thumbSize*borderedAspect;
                                drawH=thumbSize;
                            }
                        }

                        state.settings=savedSettings;

                        // Calculate centering offset
                        const offsetX=x+(thumbSize-drawW)/2;
                        const offsetY=y+(thumbSize-drawH)/2;

                        sctx.drawImage(tempCanvas,offsetX,offsetY,drawW,drawH);

                        // Add preset name and date (centered)
                        sctx.fillStyle='#666';
                        sctx.font=`${7*scale}px "PP Neue Bit", monospace`;
                        sctx.textAlign='center';
                        const profileText=p.settings.profile!=='none'?p.settings.profile.toUpperCase():'ORIGINAL';
                        const frameNum=String(photoIndex+1).padStart(2,'0');
                        const filename=`Frontier-${profileText}_${frameNum}`;
                        const date=p.uploadTime?p.uploadTime.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'}):'--/--/--';
                        sctx.fillText(filename,x+thumbSize/2,y+thumbSize+10*scale);
                        sctx.fillText(`${date}`,x+thumbSize/2,y+thumbSize+18*scale);

                        photoIndex++;
                    }
                }
            }

            // Convert canvas to image and add to photos
            return new Promise(resolve=>{
                sheet.toBlob(async blob=>{
                    const {img,blobUrl}=await loadImageFromBlob(new File([blob],'contact_sheet.jpg',{type:'image/jpeg'}));

                    state.photos.push({
                        name:'Contact Sheet',
                        displayName:'Contact Sheet',
                        image:img,
                        original:img,
                        originalBlobUrl:blobUrl,
                        uploadTime:new Date(),
                        settings:{
                            profile:'none',
                            profileIntensity:0,
                            bloom:0,
                            grain:0,
                            cyan:0,
                            magenta:0,
                            yellow:0,
                            black:0,
                            brightness:0,
                            contrast:0,
                            shadows:0,
                            highlights:0
                        },
                        fileExtension:'jpg',
                        isContactSheet:true
                    });

                    // Update counter to reflect contact sheet added
                    const counterEl=document.getElementById('photoCounter');
                    if(counterEl){
                        counterEl.textContent=`${state.currentIndex+1}/${state.photos.length}`;
                    }

                    // Update navigation buttons (next button should now be enabled)
                    updateNavButtons();

                    resolve();
                },'image/jpeg',0.92);
            });
            } catch (err) {
                console.error('Contact sheet generation failed:', err);
                // Don't throw - allow the app to continue without contact sheet
            }
        }

        async function createZipDownload(files,photoCount,originalSettings,originalIndex){
            // Load JSZip dynamically
            if(typeof JSZip==='undefined'){
                await new Promise((resolve,reject)=>{
                    const script=document.createElement('script');
                    script.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                    script.onload=resolve;
                    script.onerror=reject;
                    document.head.appendChild(script);
                });
            }

            const zip=new JSZip();

            // Add all files to ZIP
            for(const f of files){
                zip.file(f.filename,f.blob);
            }

            // Generate ZIP and download
            const zipBlob=await zip.generateAsync({type:'blob'});

            // Create download with timestamp
            const now=new Date();
            const timestamp=now.toISOString().slice(0,19).replace(/[T:]/g,'-');
            const zipFilename=`Frontier_Export_${timestamp}.zip`;

            const url=URL.createObjectURL(zipBlob);
            const a=document.createElement('a');
            a.href=url;
            a.download=zipFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(url),100);

            // Restore original settings and re-render
            state.settings={...originalSettings};
            state.currentIndex=originalIndex;
            await preloadLUTForProfile(state.settings.profile);
            renderPhoto();

            hideUploadProgress();
            setStatus('ready');

        }

        // Auto-adjust brightness, contrast, shadows, and highlights based on image analysis
        async function autoAdjustLevels() {
            haptic();
            const currentPhoto = state.photos[state.currentIndex];
            if (!currentPhoto || !currentPhoto.image) {
                console.log('❌ No current photo for auto-adjustment');
                return;
            }

            const autoBtn = document.getElementById('autoBtn');
            const isActive = autoBtn.classList.contains('active');

            // If already active, turn OFF and reset to defaults
            if (isActive) {
                console.log('🔴 AUTO: Turning off, resetting to defaults');
                autoBtn.classList.remove('active');

                // Store old values for history
                const oldBrightness = state.settings.brightness || 0;
                const oldContrast = state.settings.contrast || 0;
                const oldShadows = state.settings.shadows || 0;
                const oldHighlights = state.settings.highlights || 0;

                // Reset all to 0
                state.settings.brightness = 0;
                state.settings.contrast = 0;
                state.settings.shadows = 0;
                state.settings.highlights = 0;

                // Update UI
                document.getElementById('brightnessValue').querySelector('.cmyk-value-number').textContent = 0;
                document.getElementById('contrastValue').querySelector('.cmyk-value-number').textContent = 0;
                document.getElementById('shadowsValue').querySelector('.cmyk-value-number').textContent = 0;
                document.getElementById('highlightsValue').querySelector('.cmyk-value-number').textContent = 0;

                // Add to history
                if (oldBrightness !== 0) addToHistory(`RESET BRIGHTNESS: ${oldBrightness} → 0`, 'brightness', oldBrightness, 0);
                if (oldContrast !== 0) addToHistory(`RESET CONTRAST: ${oldContrast} → 0`, 'contrast', oldContrast, 0);
                if (oldShadows !== 0) addToHistory(`RESET SHADOWS: ${oldShadows} → 0`, 'shadows', oldShadows, 0);
                if (oldHighlights !== 0) addToHistory(`RESET HIGHLIGHTS: ${oldHighlights} → 0`, 'highlights', oldHighlights, 0);

                updateBrightnessIndicator();
                saveCurrentPhotoSettings(true, true);
                deferredRender();
                return;
            }

            // Turn ON and apply auto-adjustments
            autoBtn.classList.add('active');
            console.log('🤖 AUTO: Analyzing image...');
            setStatus('processing');

            try {
                // Create temporary canvas to analyze the image
                const tempCanvas = document.createElement('canvas');
                const ctx = tempCanvas.getContext('2d', { alpha: false, willReadFrequently: true });

                // Use a smaller size for faster analysis (800px max)
                const img = currentPhoto.image;
                const scale = Math.min(1, 800 / Math.max(img.width, img.height));
                tempCanvas.width = Math.floor(img.width * scale);
                tempCanvas.height = Math.floor(img.height * scale);

                ctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                const imageData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const pixels = imageData.data;

                // Build luminance histogram
                const hist = new Array(256).fill(0);
                let sumLum = 0;
                const pixelCount = pixels.length / 4;

                for (let i = 0; i < pixels.length; i += 4) {
                    const lum = Math.round(pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114);
                    hist[lum]++;
                    sumLum += lum;
                }

                // Calculate statistics
                const avgLum = sumLum / pixelCount;

                // Find percentiles
                const findPercentile = (percentile) => {
                    const target = pixelCount * percentile;
                    let sum = 0;
                    for (let i = 0; i < 256; i++) {
                        sum += hist[i];
                        if (sum >= target) return i;
                    }
                    return 255;
                };

                const p1 = findPercentile(0.01);   // 1st percentile (shadows)
                const p5 = findPercentile(0.05);   // 5th percentile
                const p50 = findPercentile(0.50);  // Median
                const p95 = findPercentile(0.95);  // 95th percentile
                const p99 = findPercentile(0.99);  // 99th percentile (highlights)

                const range = p95 - p5;

                console.log(`📊 Image stats: avg=${avgLum.toFixed(1)}, p1=${p1}, p5=${p5}, p50=${p50}, p95=${p95}, p99=${p99}, range=${range}`);

                // Calculate adjustments (scale -10 to +10)
                let brightness = 0;
                let contrast = 0;
                let shadows = 0;
                let highlights = 0;

                // BRIGHTNESS: Center the average around 128
                const brightnessDelta = 128 - avgLum;
                brightness = Math.round(Math.max(-10, Math.min(10, brightnessDelta / 12.8)));

                // CONTRAST: Expand if range is too narrow, compress if too wide
                const idealRange = 180; // Target range
                const contrastDelta = (idealRange - range) / idealRange;
                contrast = Math.round(Math.max(-10, Math.min(10, contrastDelta * 8)));

                // SHADOWS: Lift if shadows are crushed (p1 is too low)
                if (p1 < 10) {
                    shadows = Math.round(Math.max(0, Math.min(10, (10 - p1) / 2)));
                } else if (p5 < 30) {
                    shadows = Math.round(Math.max(0, Math.min(10, (30 - p5) / 6)));
                }

                // HIGHLIGHTS: Pull down if highlights are blown (p99 is too high)
                if (p99 > 245) {
                    highlights = Math.round(Math.max(-10, Math.min(0, (245 - p99) / 2)));
                } else if (p95 > 225) {
                    highlights = Math.round(Math.max(-10, Math.min(0, (225 - p95) / 6)));
                }

                console.log(`🎯 AUTO adjustments: brightness=${brightness}, contrast=${contrast}, shadows=${shadows}, highlights=${highlights}`);

                // Store old values for history
                const oldBrightness = state.settings.brightness || 0;
                const oldContrast = state.settings.contrast || 0;
                const oldShadows = state.settings.shadows || 0;
                const oldHighlights = state.settings.highlights || 0;

                // Apply new values
                state.settings.brightness = brightness;
                state.settings.contrast = contrast;
                state.settings.shadows = shadows;
                state.settings.highlights = highlights;

                // Update UI
                document.getElementById('brightnessValue').querySelector('.cmyk-value-number').textContent = brightness;
                document.getElementById('contrastValue').querySelector('.cmyk-value-number').textContent = contrast;
                document.getElementById('shadowsValue').querySelector('.cmyk-value-number').textContent = shadows;
                document.getElementById('highlightsValue').querySelector('.cmyk-value-number').textContent = highlights;

                // Add to history
                if (oldBrightness !== brightness) {
                    addToHistory(`AUTO BRIGHTNESS: ${oldBrightness} → ${brightness}`, 'brightness', oldBrightness, brightness);
                }
                if (oldContrast !== contrast) {
                    addToHistory(`AUTO CONTRAST: ${oldContrast} → ${contrast}`, 'contrast', oldContrast, contrast);
                }
                if (oldShadows !== shadows) {
                    addToHistory(`AUTO SHADOWS: ${oldShadows} → ${shadows}`, 'shadows', oldShadows, shadows);
                }
                if (oldHighlights !== highlights) {
                    addToHistory(`AUTO HIGHLIGHTS: ${oldHighlights} → ${highlights}`, 'highlights', oldHighlights, highlights);
                }

                updateBrightnessIndicator();
                saveCurrentPhotoSettings(true, true);
                await deferredRender();

                console.log('✅ AUTO adjustment complete');
                setStatus('ready');

            } catch (err) {
                console.error('❌ AUTO adjustment failed:', err);
                setStatus('ready');
                alert('Auto-adjustment failed. Please try manually adjusting the sliders.');
            }
        }

        // Estimate export file size based on image dimensions and JPEG quality
        function estimateExportSize(indices, quality = 0.95){
            let totalBytes = 0;

            // Contact sheet estimate: 3200x4000 at quality 0.95 ≈ 2.5MB
            totalBytes += 3200 * 4000 * 0.2;

            // Photo estimates: full resolution at specified quality
            // Quality factor: 0.95→0.25, 0.85→0.20, 0.75→0.15, 0.65→0.12 bytes per pixel
            let bytesPerPixel;
            if(quality >= 0.95) bytesPerPixel = 0.25;
            else if(quality >= 0.85) bytesPerPixel = 0.20;
            else if(quality >= 0.75) bytesPerPixel = 0.15;
            else bytesPerPixel = 0.12;

            for(const idx of indices){
                const p = state.photos[idx];
                if(!p.isContactSheet){
                    const img = p.original || p.image;
                    totalBytes += img.width * img.height * bytesPerPixel;
                }
            }

            return totalBytes;
        }

        // Find optimal quality to fit within size limit
        function findOptimalQuality(indices, maxMB = 1024){
            const maxBytes = maxMB * 1024 * 1024;
            const qualities = [0.95, 0.85, 0.75, 0.65];

            for(const quality of qualities){
                const estimatedBytes = estimateExportSize(indices, quality);
                if(estimatedBytes <= maxBytes){
                    return { quality, estimatedBytes };
                }
            }

            return null; // Can't fit even at lowest quality
        }

        async function shareContactSheet(exportQuality = 0.95){
            try{
                haptic();

                // Determine which indices to export
                let indicesToExport;
                if(state.contactSheet.selected.length>0){
                    // Export only selected photos
                    indicesToExport=state.contactSheet.selected.slice();
                }else{
                    // Export ALL photos (not videos, not contact sheet)
                    indicesToExport=[];
                    for(let i=0;i<state.photos.length;i++){
                        const p=state.photos[i];
                        if(!p.isContactSheet){
                            indicesToExport.push(i);
                        }
                    }
                }

                const photoCount=indicesToExport.length;
                if(photoCount===0){
                    alert('No photos to export');
                    return;
                }

                // For selected photos, enforce 1GB size limit with auto quality adjustment
                if(state.contactSheet.selected.length>0){
                    const maxMB = 1024;
                    const estimatedBytes = estimateExportSize(indicesToExport, exportQuality);

                    if(estimatedBytes > maxMB * 1024 * 1024){
                        // Try to find optimal quality
                        const optimal = findOptimalQuality(indicesToExport, maxMB);

                        if(optimal){
                            exportQuality = optimal.quality;
                            console.log(`Auto-adjusting quality to ${Math.round(exportQuality*100)}% for selected photos`);
                        }else{
                            const estimatedMB = Math.round(estimatedBytes / (1024 * 1024));
                            alert(`Your ${photoCount} selected photos would be approximately ${estimatedMB}MB, which is too large.\n\nPlease select fewer photos.\n\nContact sheet will be included automatically.`);
                            return;
                        }
                    }
                }

                // Close contact modal first
                toggleContactSheetView();

                // Wait for contact sheet to close (300ms animation)
                await new Promise(r=>setTimeout(r,350));

                // Show progress bar with force
                const progressBar = document.getElementById('downloadProgress');
                showUploadProgress(`Processing ${photoCount} photos...`);

                // Force it to be visible
                progressBar.classList.add('active');
                progressBar.style.display = 'block';
                progressBar.style.transform = 'translateY(0)';
                progressBar.style.opacity = '1';

                setStatus('wait');

                console.log('Progress bar element:', progressBar);
                console.log('Has active class:', progressBar.classList.contains('active'));
                console.log('Computed styles:', window.getComputedStyle(progressBar).transform, window.getComputedStyle(progressBar).opacity);

                // Wait for browser to paint progress bar
                await new Promise(r=>setTimeout(r,100));

                const files=[];

                // Generate contact sheet first and add to files
                updateUploadProgress(0,'Generating contact sheet...');
                const contactSheetBlob = await generateContactSheetImage();
                files.push(new File([contactSheetBlob],'Frontier_Contact_Sheet.jpg',{type:'image/jpeg'}));

                for(let i=0;i<indicesToExport.length;i++){
                    const idx=indicesToExport[i];
                    const p=state.photos[idx];

                    const percent=Math.round(((i+1)/photoCount)*100);
                    updateUploadProgress(percent,`Processing ${i+1}/${photoCount}...`);

                    const tempCanvas=document.createElement('canvas');
                    const ctx=tempCanvas.getContext('2d',{alpha:false});

                    const sourceImg=p.original||p.image;
                    tempCanvas.width=sourceImg.width;
                    tempCanvas.height=sourceImg.height;
                    ctx.drawImage(sourceImg,0,0);

                    // Preload LUT before applying
                    await preloadLUTForProfile(p.settings.profile);

                    const imgData=ctx.getImageData(0,0,tempCanvas.width,tempCanvas.height);
                    applyProfile(imgData,p.settings.profile);
                    applyCMYK(imgData.data,p.settings);
                    ctx.putImageData(imgData,0,0);

                    if(p.settings.bloom&&p.settings.bloom!==0){
                        applyBloom(ctx,tempCanvas.width,tempCanvas.height,p.settings.bloom);
                    }

                    const imgData2=ctx.getImageData(0,0,tempCanvas.width,tempCanvas.height);
                    applyGrain(imgData2.data,p.settings.grain||0);
                    ctx.putImageData(imgData2,0,0);

                    // Apply film border if enabled
                    if(p.settings.filmBorder){
                        await applyFilmBorder(tempCanvas,ctx,p.settings,{
                            ...p,
                            frameNumber:idx+1,
                            uploadTime:p.uploadTime||new Date()
                        });
                    }

                    // No badge on exports - only visible in UI

                    const blob=await new Promise(resolve=>tempCanvas.toBlob(resolve,'image/jpeg',exportQuality));
                    const filename=generateExportFilename(p,idx);
                    files.push(new File([blob],filename,{type:'image/jpeg'}));

                    // Memory optimization: Clear canvas and free memory after each photo
                    ctx.clearRect(0,0,tempCanvas.width,tempCanvas.height);
                    tempCanvas.width=0;
                    tempCanvas.height=0;

                    // Allow garbage collection to free memory between photos
                    if(i%5===0&&i>0){
                        await new Promise(r=>setTimeout(r,10));
                    }
                }

                // Detect if mobile (strict - desktop should ALWAYS download)
                const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);

                console.log('[Contact Modal] User agent:', navigator.userAgent);
                console.log('[Contact Modal] isMobile:', isMobile, 'isIOS:', isIOS);
                console.log('[Contact Modal] navigator.share:', !!navigator.share, 'navigator.canShare:', !!navigator.canShare);

                // ALWAYS download on desktop, only use Share API on mobile
                if(isMobile&&isIOS&&navigator.share&&navigator.canShare){
                    // iOS only: Use Share API to save to camera roll
                    console.log('[Contact Modal] Using iOS Share API');
                    updateUploadProgress(100,`Opening share sheet...`);

                    // Minimal delay to show final progress, but keep user gesture context
                    await new Promise(r=>setTimeout(r,100));

                    try{
                        if(navigator.canShare({files:files})){
                            await navigator.share({
                                files:files,
                                title:`Save ${photoCount} Image${photoCount===1?'':'s'}`
                            });
                        }else{
                            throw new Error('Cannot share files');
                        }
                    }catch(err){
                        if(err.name!=='AbortError'){
                            console.error('Share failed:',err);
                            alert('Could not share photos: '+err.message);
                        }
                    }
                }else{
                    // Desktop or Android: Download files individually
                    console.log('[Contact Modal] Using desktop/Android file downloads');
                    updateUploadProgress(0,'Downloading files...');
                    for(let i=0;i<files.length;i++){
                        const file=files[i];
                        const percent=Math.round(((i+1)/files.length)*100);
                        updateUploadProgress(percent,`Downloading ${i+1}/${files.length}: ${file.name.substring(0,20)}...`);

                        const url=URL.createObjectURL(file);
                        const a=document.createElement('a');
                        a.href=url;
                        a.download=file.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        // Small delay between downloads to avoid browser blocking
                        await new Promise(resolve=>setTimeout(resolve,100));
                    }
                    updateUploadProgress(100,`Downloaded ${photoCount} photos + contact sheet!`);
                    await new Promise(resolve=>setTimeout(resolve,1500));
                }

                hideUploadProgress();
                setStatus('ready');
            }catch(err){
                console.error('shareContactSheet error:',err);
                alert('Error exporting photos: '+err.message);
                hideUploadProgress();
                setStatus('ready');
            }
        }

        function generateExportFilename(photo,index){const now=new Date();const date=now.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}).replace(/\//g,'-');const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}).replace(/:/g,'');const profile=photo.settings.profile!=='none'?photo.settings.profile.toUpperCase():'ORIGINAL';const frameNum=String(index+1).padStart(3,'0');let editInfo='';if(photo.settings.bloom!==0)editInfo+=`_B${photo.settings.bloom}`;if(photo.settings.grain>0)editInfo+=`_G${photo.settings.grain}`;if(photo.settings.cyan!==0||photo.settings.magenta!==0||photo.settings.yellow!==0||photo.settings.black!==0){editInfo+=`_CMYK`;}const extension=photo.fileExtension||'jpg';return `FRONTIER_${profile}_${frameNum}_${date}_${time}${editInfo}.${extension}`;}

                const origW = p.original.width;
                const origH = p.original.height;
                const needsDownsample = origW > maxExportDim || origH > maxExportDim;

                let exportW = origW;
                let exportH = origH;

                if (needsDownsample) {
                    const aspectRatio = origW / origH;
                    if (origW > origH) {
                        exportW = maxExportDim;
                        exportH = maxExportDim / aspectRatio;
                    } else {
                        exportH = maxExportDim;
                        exportW = maxExportDim * aspectRatio;
                    }
                    console.log(`Downsampling export from ${origW}x${origH} to ${exportW}x${exportH}`);

                const exportCanvas=document.createElement('canvas');

                // Draw original (potentially downsampled)
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(p.original, 0, 0, exportW, exportH);

                // Apply effects
                applyEffects(ctx, exportCanvas.width, exportCanvas.height);

                updateProgress(80,'Encoding...');

                            hideProgress();
                        }catch(err){
                            if(err.name==='AbortError'){
                                hideProgress();
                            }else{
                                hideProgress();
                                alert('Share cancelled. Photo not saved.');
                            }
                        }
                    }else{
                        const url=URL.createObjectURL(b);
                        const a=document.createElement('a');
                        a.href=url;
                        a.download=filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setTimeout(()=>{
                            hideProgress();
                            alert('Photo downloaded! Check your Downloads folder or browser downloads.');
                        },500);
                    }
                },'image/jpeg',settings.jpeg);
            } catch (error) {
                console.error('Error exporting photo:', error);
                hideProgress();
                alert('Export failed. Photo may be too large. Try reducing bloom/grain settings.');
            }
        }

        // Helper function to visually trigger button press
        function triggerButtonPress(selector) {

                btn.classList.add('active');

        document.addEventListener('keydown', (e) => {
            // Don't trigger shortcuts if user is typing in an input field
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Only allow shortcuts when edit section is active (photos are loaded)
            const editSection = document.getElementById('editSection');
            if (!editSection || !editSection.classList.contains('active')) {
                return;
            }

            const cmd = e.metaKey || e.ctrlKey;
            const key = e.key.toLowerCase();

            // Arrow keys - Navigate photos
            if (key === 'arrowright') {
                e.preventDefault();
                const btn = document.getElementById('nextBtn');
                if (btn) {
                    triggerButtonPress('#nextBtn');
                }
                nextPhoto();
                return;
            }
            if (key === 'arrowleft') {
                e.preventDefault();
                const btn = document.getElementById('prevBtn');
                if (btn) {
                    triggerButtonPress('#prevBtn');
                }
                prevPhoto();
                return;
            }

            // S - Supra preset
            if (key === 's' && !cmd) {
                e.preventDefault();
                const btn = document.querySelector('[onclick*="supra"]');
                if (btn) {
                    btn.click();
                }
                return;
            }

            // C - Chrome preset
            if (key === 'c' && !cmd) {
                e.preventDefault();
                const btn = document.querySelector('[onclick*="chrome"]');
                if (btn) {
                    btn.click();
                }
                return;
            }

            // X - XXX preset
            if (key === 'x') {
                e.preventDefault();
                const btn = document.querySelector('[onclick*="xxx"]');
                if (btn) {
                    btn.click();
                }
                return;
            }

            // B - Toggle borders
            if (key === 'b') {
                e.preventDefault();
                const btn = document.querySelector('[onclick="toggleFilmBorder()"]');
                if (btn) {
                    btn.click();
                }
                return;

                    <p>Fine-tune your photos with professional controls:</p>
                    <ul>
                        <li><strong>CMYK:</strong> Advanced color correction (cyan, magenta, yellow, black)</li>
                        <li><strong>Brightness:</strong> Exposure, contrast, shadows, highlights</li>
                        <li><strong>Bloom:</strong> Halation glow effect (1/2 keys)</li>
                        <li><strong>Grain:</strong> Film grain texture (+/- keys)</li>
                        <li><strong>Borders (B key):</strong> Authentic film frame borders with metadata</li>
                    </ul>
                `
            },
            {
                title: "Export & Save",
                content: `
                    <p>Save your processed photos:</p>
                    <ul>
                        <li><strong>DOWNLOAD button:</strong> Choose save options</li>
                        <li><strong>Save Current:</strong> Export just this photo</li>
                        <li><strong>Save All:</strong> Export all photos with contact sheet</li>
                        <li><strong>Contact Sheet:</strong> View and select multiple photos</li>
                        <li><strong>Hold settings (Cmd+H):</strong> Apply same edits to next photo</li>
                    </ul>
                    <p>You're ready to start processing! Enjoy the Frontier experience.</p>
                `
            }
        ];

        let currentGuideStep = 0;

        function openGuide() {
            haptic();
            closeMoreDialog();
            closeNavDialog();
            // Show chapter list
            document.getElementById('guideChapters').classList.add('active');
            document.getElementById('guideContent').style.display = 'none';
            document.querySelector('.guide-footer').style.display = 'none';
            document.getElementById('guideOverlay').classList.add('active');
        }

        function closeGuide() {
            haptic();
            document.getElementById('guideOverlay').classList.remove('active');
        }

        function openChapter(chapterIndex) {
            haptic();
            currentGuideStep = chapterIndex;
            // Hide chapter list, show content
            document.getElementById('guideChapters').classList.remove('active');
            document.getElementById('guideContent').style.display = 'block';
            document.querySelector('.guide-footer').style.display = 'flex';
            renderGuideStep();
        }

        function backToChapters() {
            haptic();
            // Show chapter list, hide content
            document.getElementById('guideChapters').classList.add('active');
            document.getElementById('guideContent').style.display = 'none';
            document.querySelector('.guide-footer').style.display = 'none';
        }

        function renderGuideStep() {
            const content = document.getElementById('guideContent');
            const progress = document.getElementById('guideProgress');
            const backBtn = document.getElementById('guideBack');
            const nextBtn = document.getElementById('guideNext');

            const step = guideSteps[currentGuideStep];

            content.innerHTML = `
                <div class="guide-step active">
                    <h2>${step.title}</h2>
                    ${step.content}
                </div>
            `;

            progress.textContent = `${currentGuideStep + 1} / ${guideSteps.length}`;

            backBtn.disabled = currentGuideStep === 0;
            nextBtn.textContent = currentGuideStep === guideSteps.length - 1 ? 'DONE' : 'NEXT';
        }

        function nextGuideStep() {
            haptic();
            if (currentGuideStep === guideSteps.length - 1) {
                closeGuide();
            } else {
                currentGuideStep++;
                renderGuideStep();
            }
        }

        function prevGuideStep() {
            haptic();
            if (currentGuideStep > 0) {
                currentGuideStep--;
                renderGuideStep();
            }
        }
    </script>
    <!-- Interactive Guide -->
    <div id="guideOverlay">
        <div id="guideModal">
            <div class="guide-header">
                <img src="Logo.svg" alt="Frontier" class="guide-logo">
                <button class="guide-close" onclick="closeGuide()">X</button>
            </div>

            <!-- Chapter Selection -->
            <div class="guide-chapters active" id="guideChapters">
                <button class="guide-chapter-btn" onclick="openChapter(0)">1. Welcome to Frontier</button>
                <button class="guide-chapter-btn" onclick="openChapter(1)">2. Upload & Navigation</button>
                <button class="guide-chapter-btn" onclick="openChapter(2)">3. Film Profiles & Presets</button>
                <button class="guide-chapter-btn" onclick="openChapter(3)">4. Adjustments & Effects</button>
                <button class="guide-chapter-btn" onclick="openChapter(4)">5. Export & Save</button>
            </div>

            <!-- Chapter Content -->
            <div class="guide-content" id="guideContent"></div>
            <div class="guide-footer">
                <button class="guide-btn" onclick="backToChapters()">CHAPTERS</button>
                <div class="guide-progress" id="guideProgress">1 / 5</div>
                <div class="guide-nav">
                    <button class="guide-btn" id="guideBack" onclick="prevGuideStep()">BACK</button>
                    <button class="guide-btn primary" id="guideNext" onclick="nextGuideStep()">NEXT</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
