<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Frontier Digital Processor</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3897AF">
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#3897AF; overflow:hidden; width:100vw; height:100vh; position:fixed; }

        /* UPLOAD SCREEN - Simplified */
        #uploadSection { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100vh; padding:40px 20px; }
        #uploadSection.hidden { display:none; }
        .logo-container { position:relative; margin-bottom:40px; }
        .logo-container img { width:min(250px, 70vw); height:auto; }
        .status-lights { position:absolute; right:-30px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; }
        .status-light { width:10px; height:10px; border-radius:50%; border:2px solid #0A5A6C; opacity:0.3; }
        .status-light.active { opacity:1; box-shadow:0 0 10px currentColor; }
        .status-light.green { background:#4ADE80; color:#4ADE80; }
        .status-light.red { background:#EF4444; color:#EF4444; }
        .upload-label { font-size:10px; font-weight:600; color:#EEEDF0; letter-spacing:1px; margin-bottom:10px; text-align:center; }
        .upload-btn { width:100px; height:50px; background:#D4CEC8; border:3px solid #000; border-radius:4px; cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; }
        #fileInput { display:none; }

        /* EDIT SCREEN - Mobile Optimized */
        #editSection { display:none; flex-direction:column; width:100vw; height:100vh; background:#8C8C8C; position:fixed; top:0; left:0; }
        #editSection.active { display:flex; }

        .edit-header { background:#000; color:#fff; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; min-height:50px; }
        .header-left { display:flex; align-items:center; gap:10px; }
        .gallery-btn { width:28px; height:28px; background:none; border:none; cursor:pointer; padding:2px; }
        .gallery-btn img { width:100%; filter:invert(1); }
        .filename { font-size:13px; font-weight:500; }
        .header-right { font-size:20px; cursor:pointer; padding:0 5px; }

        .canvas-container { flex:1; display:flex; align-items:center; justify-content:center; padding:15px; overflow:hidden; min-height:0; }
        #canvas { max-width:100%; max-height:100%; object-fit:contain; }

        .edit-footer { background:#8C8C8C; padding:10px 12px; display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto; }

        .footer-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
        .action-buttons { display:flex; gap:8px; flex:1; min-width:0; }
        .action-btn { padding:8px 12px; background:#B3B3B3; border:2px solid #000; border-radius:4px; font-size:10px; font-weight:600; cursor:pointer; text-transform:uppercase; white-space:nowrap; }

        .nav-controls { display:flex; align-items:center; gap:8px; }
        .nav-btn { width:32px; height:32px; background:#000; border:none; border-radius:4px; cursor:pointer; color:#fff; font-size:16px; flex-shrink:0; }
        .photo-counter { font-size:14px; font-weight:600; min-width:50px; text-align:center; }
        .save-btn { padding:10px 20px; background:#3897AF; border:2px solid #000; border-radius:4px; color:#fff; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0; }

        .control-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:5px; }
        .control-tab { padding:8px 6px; background:#B3B3B3; border:2px solid #000; border-radius:4px; font-size:9px; font-weight:700; text-align:center; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
        .control-tab.active { background:#000; color:#fff; }
        .control-tab-value { font-size:10px; }

        .expanded-controls { display:none; padding:12px; background:#B3B3B3; border:2px solid #000; border-radius:4px; margin-top:8px; }
        .expanded-controls.active { display:block; }

        .preset-buttons { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
        .profile-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
        .preset-btn { padding:10px 4px; background:#D4D4D4; border:2px solid #000; border-radius:4px; font-size:9px; font-weight:700; cursor:pointer; text-align:center; line-height:1.2; }
        .preset-btn.active { background:#000; color:#fff; }

        .slider-control { display:flex; align-items:center; justify-content:center; gap:10px; }
        .slider-btn { width:44px; height:44px; background:#D4D4D4; border:2px solid #000; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .slider-btn img { width:22px; height:22px; }
        .slider-value { min-width:60px; padding:12px 10px; background:#fff; border:2px solid #000; border-radius:4px; font-size:20px; font-weight:700; text-align:center; }

        .cmyk-sliders { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
        .cmyk-slider { padding:6px; border-radius:4px; border:2px solid #000; display:flex; flex-direction:column; gap:4px; }
        .cmyk-slider.cyan { background:#00FFFF; }
        .cmyk-slider.magenta { background:#FF00FF; }
        .cmyk-slider.yellow { background:#FFFF00; }
        .cmyk-slider.black { background:#666666; }
        .cmyk-slider .slider-btn { width:100%; height:30px; }
        .cmyk-slider .slider-btn img { width:16px; height:16px; }
        .cmyk-slider .slider-value { width:100%; padding:6px 4px; font-size:15px; min-width:0; }

        @media (max-width:360px) {
            .action-btn { font-size:9px; padding:6px 10px; }
            .save-btn { padding:8px 16px; font-size:11px; }
            .control-tab { font-size:8px; padding:6px 4px; }
            .preset-btn { font-size:8px; padding:8px 3px; }
        }
    </style>
</head>
<body>
    <div id="uploadSection">
        <div class="logo-container">
            <img src="Logo.svg" alt="Frontier">
            <div class="status-lights">
                <div class="status-light green active" id="statusReady"></div>
                <div class="status-light red" id="statusWait"></div>
            </div>
        </div>
        <div>
            <div class="upload-label">UPLOAD PHOTO OR VIDEO</div>
            <label for="fileInput" class="upload-btn"><span>≡</span></label>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
    </div>

    <div id="editSection">
        <div class="edit-header">
            <div class="header-left">
                <button class="gallery-btn" onclick="backToUpload()">
                    <img src="Gallery viewe.svg" alt="Gallery">
                </button>
                <div class="filename" id="filename">PHOTO.JPG</div>
            </div>
            <div class="header-right">⋮</div>
        </div>
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        <div class="edit-footer">
            <div class="footer-top">
                <div class="action-buttons">
                    <button class="action-btn" onclick="togglePreview()">Preview</button>
                    <button class="action-btn" onclick="toggleDarkMode()">Dark Mode</button>
                    <button class="action-btn" onclick="copySettings()">Copy</button>
                </div>
                <div class="nav-controls">
                    <button class="nav-btn" onclick="prevPhoto()">◀</button>
                    <div class="photo-counter" id="photoCounter">1/36</div>
                    <button class="nav-btn" onclick="nextPhoto()">▶</button>
                    <button class="save-btn" onclick="savePhoto()">SAVE</button>
                </div>
            </div>
            <div class="control-tabs">
                <button class="control-tab" onclick="toggleControl('profile')">
                    <span class="control-tab-value" id="profileValue">NONE</span>
                    <span>PROFILE</span>
                </button>
                <button class="control-tab" onclick="toggleControl('tone')">
                    <span class="control-tab-value" id="toneValue">SHOW-S</span>
                    <span>TONE</span>
                </button>
                <button class="control-tab" onclick="toggleControl('bloom')">
                    <span class="control-tab-value" id="bloomValue">3</span>
                    <span>BLOOM</span>
                </button>
                <button class="control-tab" onclick="toggleControl('grain')">
                    <span class="control-tab-value" id="grainValue">2</span>
                    <span>GRAIN</span>
                </button>
            </div>
            <div class="expanded-controls" id="profileControl">
                <div class="profile-buttons">
                    <button class="preset-btn active" onclick="setProfile('none')">NONE</button>
                    <button class="preset-btn" onclick="setProfile('portra')">PORTRA</button>
                    <button class="preset-btn" onclick="setProfile('slide')">SLIDE</button>
                    <button class="preset-btn" onclick="setProfile('bw')">B&W</button>
                </div>
                <div class="cmyk-sliders">
                    <div class="cmyk-slider cyan">
                        <button class="slider-btn" onclick="adjustCMYK('c',1)"><img src="Arrow up.svg"></button>
                        <div class="slider-value" id="cyanValue">0</div>
                        <button class="slider-btn" onclick="adjustCMYK('c',-1)"><img src="Arrow down.svg"></button>
                    </div>
                    <div class="cmyk-slider magenta">
                        <button class="slider-btn" onclick="adjustCMYK('m',1)"><img src="Arrow up.svg"></button>
                        <div class="slider-value" id="magentaValue">0</div>
                        <button class="slider-btn" onclick="adjustCMYK('m',-1)"><img src="Arrow down.svg"></button>
                    </div>
                    <div class="cmyk-slider yellow">
                        <button class="slider-btn" onclick="adjustCMYK('y',1)"><img src="Arrow up.svg"></button>
                        <div class="slider-value" id="yellowValue">0</div>
                        <button class="slider-btn" onclick="adjustCMYK('y',-1)"><img src="Arrow down.svg"></button>
                    </div>
                    <div class="cmyk-slider black">
                        <button class="slider-btn" onclick="adjustCMYK('k',1)"><img src="Arrow up.svg"></button>
                        <div class="slider-value" id="blackValue">0</div>
                        <button class="slider-btn" onclick="adjustCMYK('k',-1)"><img src="Arrow down.svg"></button>
                    </div>
                </div>
            </div>
            <div class="expanded-controls" id="toneControl">
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setTone('none')">NONE</button>
                    <button class="preset-btn" onclick="setTone('high-soft')">HIGH<br>SOFT</button>
                    <button class="preset-btn" onclick="setTone('high-hard')">HIGH<br>HARD</button>
                    <button class="preset-btn active" onclick="setTone('show-soft')">SHOW<br>SOFT</button>
                    <button class="preset-btn" onclick="setTone('show-hard')">SHOW<br>HARD</button>
                </div>
            </div>
            <div class="expanded-controls" id="bloomControl">
                <div class="slider-control">
                    <button class="slider-btn" onclick="adjustBloom(-1)"><img src="Arrow down.svg"></button>
                    <div class="slider-value" id="bloomValueBig">3</div>
                    <button class="slider-btn" onclick="adjustBloom(1)"><img src="Arrow up.svg"></button>
                </div>
            </div>
            <div class="expanded-controls" id="grainControl">
                <div class="slider-control">
                    <button class="slider-btn" onclick="adjustGrain(-1)"><img src="Arrow down.svg"></button>
                    <div class="slider-value" id="grainValueBig">2</div>
                    <button class="slider-btn" onclick="adjustGrain(1)"><img src="Arrow up.svg"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state={photos:[],currentIndex:0,activeControl:null,settings:{profile:'none',tone:'show-soft',bloom:3,grain:2,cyan:0,magenta:0,yellow:0,black:0}};
        function setStatus(s){document.getElementById('statusReady').classList.toggle('active',s==='ready');document.getElementById('statusWait').classList.toggle('active',s!=='ready');}

        document.getElementById('fileInput').addEventListener('change',async(e)=>{const files=Array.from(e.target.files);if(!files.length||files.length>36)return;setStatus('wait');state.photos=[];for(let file of files){const img=await new Promise(r=>{const reader=new FileReader();reader.onload=ev=>{const i=new Image();i.onload=()=>r(i);i.src=ev.target.result;};reader.readAsDataURL(file);});state.photos.push({name:file.name,image:img,original:img});}state.currentIndex=0;document.getElementById('uploadSection').classList.add('hidden');document.getElementById('editSection').classList.add('active');document.body.style.background='#8C8C8C';renderPhoto();setStatus('ready');});

        function prevPhoto(){if(state.currentIndex>0){state.currentIndex--;renderPhoto();}}
        function nextPhoto(){if(state.currentIndex<state.photos.length-1){state.currentIndex++;renderPhoto();}}
        function backToUpload(){document.getElementById('editSection').classList.remove('active');document.getElementById('uploadSection').classList.remove('hidden');document.body.style.background='#3897AF';}

        function renderPhoto(){const p=state.photos[state.currentIndex];if(!p)return;document.getElementById('filename').textContent=p.name.toUpperCase();document.getElementById('photoCounter').textContent=`${state.currentIndex+1}/${state.photos.length}`;const c=document.getElementById('canvas'),ctx=c.getContext('2d');c.width=p.image.width;c.height=p.image.height;ctx.drawImage(p.image,0,0);applyEffects(ctx,c.width,c.height);}

        function applyEffects(ctx,w,h){const imgData=ctx.getImageData(0,0,w,h),d=imgData.data;applyProfile(d,state.settings.profile);applyCMYK(d,state.settings);applyTone(d,state.settings.tone);applyGrain(d,state.settings.grain);ctx.putImageData(imgData,0,0);if(state.settings.bloom>0)applyBloom(ctx,w,h,state.settings.bloom);}

        function applyProfile(d,p){if(p==='none')return;for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];if(p==='portra'){r=Math.min(255,r*1.08+8);g=Math.min(255,g*1.03+3);b=Math.min(255,b*0.97);}else if(p==='slide'){const L=0.299*r+0.587*g+0.114*b;r=Math.min(255,r+(r-L)*0.7-5);g=Math.min(255,g+(g-L)*0.6);b=Math.min(255,b+(b-L)*0.8+15);}else if(p==='bw'){const L=0.299*r+0.587*g+0.114*b,c=(L-128)*1.15+128;r=g=b=Math.max(0,Math.min(255,c));}d[i]=r;d[i+1]=g;d[i+2]=b;}}

        function applyCMYK(d,s){const cA=s.cyan/50,mA=s.magenta/50,yA=s.yellow/50,kA=s.black/50;for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];r=Math.max(0,Math.min(255,r-cA*40));g=Math.max(0,Math.min(255,g+cA*20));b=Math.max(0,Math.min(255,b+cA*20));r=Math.max(0,Math.min(255,r+mA*20));g=Math.max(0,Math.min(255,g-mA*40));b=Math.max(0,Math.min(255,b+mA*20));r=Math.max(0,Math.min(255,r+yA*20));g=Math.max(0,Math.min(255,g+yA*20));b=Math.max(0,Math.min(255,b-yA*40));const dF=1-kA*0.25;r*=dF;g*=dF;b*=dF;d[i]=r;d[i+1]=g;d[i+2]=b;}}

        function applyTone(d,t){if(t==='none')return;const curves={'high-soft':{shadows:1.15,highlights:0.92},'high-hard':{shadows:1.25,highlights:1.08},'show-soft':{shadows:1.08,highlights:0.88},'show-hard':{shadows:1.12,highlights:0.94}},cv=curves[t];if(!cv)return;for(let i=0;i<d.length;i+=4){const lum=(d[i]+d[i+1]+d[i+2])/3,f=lum<128?cv.shadows:cv.highlights;d[i]=Math.max(0,Math.min(255,d[i]*f));d[i+1]=Math.max(0,Math.min(255,d[i+1]*f));d[i+2]=Math.max(0,Math.min(255,d[i+2]*f));}}

        function applyBloom(ctx,w,h,int){const tc=document.createElement('canvas');tc.width=w;tc.height=h;const tctx=tc.getContext('2d');tctx.filter=`blur(${int*1.5}px)`;tctx.drawImage(ctx.canvas,0,0);ctx.globalCompositeOperation='lighten';ctx.globalAlpha=int/30;ctx.drawImage(tc,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}

        function applyGrain(d,int){if(int<1)return;for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*int*8;d[i]=Math.max(0,Math.min(255,d[i]+n));d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));}}

        function toggleControl(c){['profile','tone','bloom','grain'].forEach(ct=>{const el=document.getElementById(ct+'Control');if(ct===c&&!el.classList.contains('active')){el.classList.add('active');state.activeControl=c;}else{el.classList.remove('active');}});document.querySelectorAll('.control-tab').forEach((t,i)=>t.classList.toggle('active',['profile','tone','bloom','grain'][i]===c));}

        function setProfile(p){state.settings.profile=p;const lb={none:'NONE',portra:'PORTRA',slide:'SLIDE',bw:'B&W'};document.getElementById('profileValue').textContent=lb[p];document.querySelectorAll('#profileControl .preset-btn').forEach((b,i)=>b.classList.toggle('active',['none','portra','slide','bw'][i]===p));renderPhoto();}

        function setTone(t){state.settings.tone=t;const lb={none:'NONE','high-soft':'H-SFT','high-hard':'H-HRD','show-soft':'SHOW-S','show-hard':'SHOW-H'};document.getElementById('toneValue').textContent=lb[t];document.querySelectorAll('#toneControl .preset-btn').forEach((b,i)=>b.classList.toggle('active',['none','high-soft','high-hard','show-soft','show-hard'][i]===t));renderPhoto();}

        function adjustBloom(d){state.settings.bloom=Math.max(0,Math.min(10,state.settings.bloom+d));document.getElementById('bloomValue').textContent=state.settings.bloom;document.getElementById('bloomValueBig').textContent=state.settings.bloom;renderPhoto();}

        function adjustGrain(d){state.settings.grain=Math.max(0,Math.min(10,state.settings.grain+d));document.getElementById('grainValue').textContent=state.settings.grain;document.getElementById('grainValueBig').textContent=state.settings.grain;renderPhoto();}

        function adjustCMYK(ch,d){const chs={c:'cyan',m:'magenta',y:'yellow',k:'black'},k=chs[ch];state.settings[k]=Math.max(-50,Math.min(50,state.settings[k]+d));document.getElementById(k+'Value').textContent=state.settings[k];renderPhoto();}

        function savePhoto(){const c=document.getElementById('canvas');c.toBlob(b=>{const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`frontier_${state.photos[state.currentIndex].name}`;a.click();URL.revokeObjectURL(url);},'image/jpeg',0.95);}

        function togglePreview(){const modal=document.getElementById('previewModal')||createPreviewModal();modal.style.display=modal.style.display==='flex'?'none':'flex';}
        function createPreviewModal(){const m=document.createElement('div');m.id='previewModal';m.style.cssText='display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;align-items:center;justify-content:center;';m.onclick=()=>m.style.display='none';const img=document.createElement('img');img.id='previewImg';img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;';m.appendChild(img);document.body.appendChild(m);m.onclick=()=>{img.src=document.getElementById('canvas').toDataURL();m.style.display='flex';};return m;}

        function toggleDarkMode(){document.body.classList.toggle('dark-mode');const isDark=document.body.classList.contains('dark-mode');document.querySelector('.edit-header').style.background=isDark?'#1a1a1a':'#000';document.querySelector('.edit-footer').style.background=isDark?'#1a1a1a':'#8C8C8C';document.querySelector('.canvas-container').style.background=isDark?'#000':'#8C8C8C';}

        function copySettings(){const s=state.settings;const text=JSON.stringify(s,null,2);navigator.clipboard.writeText(text).then(()=>alert('Settings copied to clipboard!'));console.log('Current settings:',s);}
    </script>
</body>
</html>
