<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>SP500 Film Simulator</title>

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SP500">
    <meta name="theme-color" content="#c0c0c0">
    <meta name="format-detection" content="telephone=no">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-180.png">

    <!-- Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        input, select, textarea {
            -webkit-user-select: auto;
            user-select: auto;
            font-size: 16px !important;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #c0c0c0;
            color: #000;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body.preview-active {
            overflow: hidden;
            height: 100vh;
        }

        /* === RETRO 3D BUTTON STYLE === */
        .btn-3d {
            position: relative;
            background: #c0c0c0;
            border: none;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-weight: bold;
            transition: all 0.1s;
        }

        .btn-3d::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: -2px;
            bottom: -2px;
            background: #d8cecb;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            z-index: -1;
            transform: rotate(180deg);
        }

        .btn-3d:active {
            transform: translate(1px, 1px);
        }

        .btn-3d.active {
            background: #fff;
        }

        .btn-primary-3d {
            background: #027e7e;
            color: #fff;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
        }

        .btn-primary-3d::before {
            background: #d8cecb;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            padding-top: calc(16px + env(safe-area-inset-top));
            background: #c0c0c0;
            border-bottom: 2px solid #808080;
        }

        .header-title {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* === UPLOAD SECTION === */
        .upload-section {
            padding: 40px 20px;
            text-align: center;
            display: none;
            background: #c0c0c0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-section.active {
            display: flex;
        }

        .upload-content {
            max-width: 500px;
            width: 100%;
        }

        .upload-area {
            border: 4px dashed #808080;
            padding: 60px 20px;
            margin: 20px 0;
            background: #fff;
            cursor: pointer;
            position: relative;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid #808080;
            z-index: -1;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .file-input {
            display: none;
        }

        /* === IMAGE PREVIEW === */
        .preview-section {
            display: none;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Use dynamic viewport height on mobile */
            background: #c0c0c0;
            z-index: 10;
        }

        .preview-section.active {
            display: flex;
        }

        .preview-container {
            flex: 1;
            position: relative;
            background: #424242;
            border: 2px solid #808080;
            overflow: hidden;
        }

        .preview-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            cursor: pointer;
        }

        /* Status indicator */
        .status-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
            display: none;
            z-index: 10;
        }

        .status-indicator.active {
            display: block;
            animation: pulse 0.5s ease-in-out 3;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.2);
            }
        }

        /* === FILMSTRIP NAV === */
        .filmstrip-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 24px;
            flex: 1;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-counter {
            font-size: 14px;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
        }

        .save-btn {
            padding: 12px 24px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* === MODE BUTTONS === */
        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            background: #c0c0c0;
        }

        .mode-btn {
            padding: 12px 8px;
            font-size: 10px;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* === CONTROLS === */
        .controls {
            padding: 16px 24px calc(24px + env(safe-area-inset-bottom)) 24px;
            background: #c0c0c0;
            min-height: 200px;
            overflow: hidden;
        }

        /* Control Menus */
        .control-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .menu-option {
            padding: 16px 12px;
            font-size: 9px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Control Sliders */
        .control-slider {
            max-width: 300px;
            margin: 0 auto;
        }

        .slider-display {
            background: #fff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .slider-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .slider-btn {
            padding: 16px;
            font-size: 20px;
            text-align: center;
        }

        /* === LOADING === */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(192, 192, 192, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .loading.active {
            display: flex;
        }

        .loading-text {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .pixel-box {
            width: 200px;
            height: 20px;
            border: 2px solid #000;
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        .pixel-fill {
            height: 100%;
            background: #027e7e;
            width: 0%;
            transition: width 0.3s;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .header-title {
                font-size: 10px;
            }

            .mode-btn {
                font-size: 8px;
                padding: 10px 4px;
            }

            .control-label {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Upload Section -->
    <div class="upload-section active" id="uploadSection">
        <div class="upload-content">
            <h1 style="font-size: 16px; margin-bottom: 20px; letter-spacing: 2px;">SP500 FILM SCANNER</h1>
            <p style="font-size: 10px; margin-bottom: 30px; line-height: 1.6;">PROFESSIONAL FRONTIER EMULATION</p>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <div class="upload-text">TAP TO UPLOAD</div>
                <div class="upload-text">1-36 PHOTOS</div>
                <div class="upload-text" style="font-size: 9px; margin-top: 12px;">JPG • PNG • HEIC</div>
            </div>

            <input
                type="file"
                id="fileInput"
                class="file-input"
                accept="image/*,image/heic,image/heif"
                multiple
            />
        </div>
    </div>

    <!-- Preview Section -->
    <div class="preview-section" id="previewSection">
        <!-- Header -->
        <div class="header">
            <button class="icon-btn" id="backBtn">←</button>
            <div class="header-title" id="filename">IMAGE_001.JPG</div>
            <button class="icon-btn" id="menuBtn">☰</button>
        </div>

        <!-- Image Preview -->
        <div class="preview-container" id="previewContainer">
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
            <div class="status-indicator" id="statusIndicator"></div>
        </div>

        <!-- Filmstrip Navigation -->
        <div class="filmstrip-nav">
            <div class="nav-controls">
                <button class="btn-3d nav-btn" id="prevBtn">←</button>
                <div class="frame-counter" id="frameCounter">1/1</div>
                <button class="btn-3d nav-btn" id="nextBtn">→</button>
            </div>
            <button class="btn-3d btn-primary-3d save-btn" id="saveBtn">SAVE</button>
        </div>

        <!-- Mode Buttons -->
        <div class="mode-buttons">
            <button class="btn-3d mode-btn" id="colorBtn" data-mode="color">PORTRA</button>
            <button class="btn-3d mode-btn" id="softBtn" data-mode="soft">STANDARD</button>
            <button class="btn-3d mode-btn" id="bloomBtn" data-mode="bloom">BLOOM</button>
            <button class="btn-3d mode-btn" id="grainBtn" data-mode="grain">GRAIN</button>
        </div>

        <!-- Dynamic Controls (shown based on active button) -->
        <div class="controls" id="controls">
            <!-- Color Options Menu -->
            <div class="control-menu" id="colorMenu" style="display: none;">
                <button class="btn-3d menu-option active" data-colormode="portra400">PORTRA 400</button>
                <button class="btn-3d menu-option" data-colormode="trix400">TRI-X (B&W)</button>
                <button class="btn-3d menu-option" data-colormode="ektachrome">EKTACHROME</button>
            </div>

            <!-- Bloom Controls -->
            <div class="control-slider" id="bloomControls" style="display: none;">
                <div class="slider-display" id="bloomDisplay">0</div>
                <div class="slider-buttons">
                    <button class="btn-3d slider-btn" data-control="bloom" data-dir="-">▼</button>
                    <button class="btn-3d slider-btn" data-control="bloom" data-dir="+">▲</button>
                </div>
            </div>

            <!-- Grain Controls -->
            <div class="control-slider" id="grainControls" style="display: none;">
                <div class="slider-display" id="grainDisplay">0</div>
                <div class="slider-buttons">
                    <button class="btn-3d slider-btn" data-control="grain" data-dir="-">▼</button>
                    <button class="btn-3d slider-btn" data-control="grain" data-dir="+">▲</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading" id="loadingOverlay">
        <div class="loading-text" id="loadingText">PROCESSING...</div>
        <div class="pixel-box">
            <div class="pixel-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        // ========================================
        // STATE MANAGEMENT
        // ========================================

        const state = {
            photos: [],
            currentIndex: 0,
            activeControl: null,  // which button is active
            defaultSettings: {
                colorMode: 'portra400',  // portra400, trix400, ektachrome
                softMode: 'STANDARD',    // STANDARD, SOFT, SHADOW SOFT, HIGHLIGHT SOFT
                bloom: 0,                // 0-20
                grain: 0                 // 0-10 (default 0 = no grain)
            },
            zoom: {
                scale: 1,
                translateX: 0,
                translateY: 0
            }
        };

        // ========================================
        // UTILITY FUNCTIONS
        // ========================================

        function haptic(type = 'light') {
            if ('vibrate' in navigator) {
                const patterns = { light: 10, medium: 20, heavy: 50, success: [10, 50, 10] };
                navigator.vibrate(patterns[type] || patterns.light);
            }
        }

        function showLoading(text = 'PROCESSING...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // ========================================
        // FILE UPLOAD
        // ========================================

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            await handleFiles(files);
        });

        async function handleFiles(files) {
            if (files.length === 0) return;
            if (files.length > 36) {
                alert('MAX 36 PHOTOS');
                return;
            }

            showLoading('LOADING...');

            try {
                state.photos = [];

                for (let i = 0; i < files.length; i++) {
                    updateProgress((i / files.length) * 100);

                    const imageData = await loadImage(files[i]);

                    state.photos.push({
                        original: imageData,
                        processed: null,
                        filename: files[i].name,
                        settings: { ...state.defaultSettings }
                    });
                }

                updateProgress(100);

                // Switch to preview mode
                document.getElementById('uploadSection').classList.remove('active');
                document.getElementById('previewSection').classList.add('active');
                document.body.classList.add('preview-active');

                // Reset scroll position
                window.scrollTo(0, 0);

                // Process first photo with default settings
                processCurrentPhoto();
                updateUI();
                setupZoom();

                haptic('success');
            } catch (err) {
                console.error('Error loading files:', err);
                alert('ERROR LOADING');
            } finally {
                hideLoading();
            }
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ========================================
        // UI RENDERING
        // ========================================

        function renderPreview() {
            const photo = state.photos[state.currentIndex];
            if (!photo) return;

            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            const imageData = photo.processed || photo.original;

            canvas.width = imageData.width;
            canvas.height = imageData.height;
            ctx.putImageData(imageData, 0, 0);

            // Apply zoom transform
            const zoom = state.zoom;
            canvas.style.transform = `translate(-50%, -50%) translate(${zoom.translateX}px, ${zoom.translateY}px) scale(${zoom.scale})`;

            document.getElementById('filename').textContent = photo.filename.toUpperCase();
            document.getElementById('frameCounter').textContent = `${state.currentIndex + 1}/${state.photos.length}`;
        }

        function updateUI() {
            const settings = state.photos[state.currentIndex].settings;

            // Hide all control panels
            document.getElementById('colorMenu').style.display = 'none';
            document.getElementById('bloomControls').style.display = 'none';
            document.getElementById('grainControls').style.display = 'none';

            // Show active control panel
            if (state.activeControl === 'color') {
                document.getElementById('colorMenu').style.display = 'grid';
            } else if (state.activeControl === 'bloom') {
                document.getElementById('bloomControls').style.display = 'block';
            } else if (state.activeControl === 'grain') {
                document.getElementById('grainControls').style.display = 'block';
            }

            // Update color menu options
            document.querySelectorAll('[data-colormode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.colormode === settings.colorMode);
            });

            // Update COLOR button label and active state
            const colorNames = {
                'portra400': 'PORTRA',
                'trix400': 'TRI-X',
                'ektachrome': 'EKTAR'
            };
            const colorBtn = document.getElementById('colorBtn');
            colorBtn.textContent = colorNames[settings.colorMode] || 'COLOR';
            // Active if panel is open OR if non-default film
            colorBtn.classList.toggle('active', state.activeControl === 'color');

            // Update SOFT button label and active state
            const softBtn = document.getElementById('softBtn');
            softBtn.textContent = settings.softMode;
            // Active if panel is open OR if non-standard mode
            softBtn.classList.toggle('active', settings.softMode !== 'STANDARD');

            // Update BLOOM button label and active state
            const bloomBtn = document.getElementById('bloomBtn');
            const bloomText = settings.bloom > 0 ? `BLOOM (+${settings.bloom})` : 'BLOOM';
            bloomBtn.textContent = bloomText;
            // Active if panel is open OR if bloom > 0
            bloomBtn.classList.toggle('active', state.activeControl === 'bloom' || settings.bloom > 0);

            // Update GRAIN button label and active state
            const grainBtn = document.getElementById('grainBtn');
            let grainText = 'GRAIN';
            if (settings.grain > 0) {
                grainText = `GRAIN (+${settings.grain})`;
            }
            grainBtn.textContent = grainText;
            // Active if panel is open OR if grain > 0
            grainBtn.classList.toggle('active', state.activeControl === 'grain' || settings.grain > 0);

            // Update slider displays
            document.getElementById('bloomDisplay').textContent = settings.bloom;
            document.getElementById('grainDisplay').textContent = settings.grain;
        }

        // Pinch to zoom and tap to preview original
        function setupZoom() {
            const canvas = document.getElementById('previewCanvas');
            const container = canvas.parentElement;

            let initialDistance = 0;
            let initialScale = 1;
            let lastTouchX = 0;
            let lastTouchY = 0;
            let touchStartTime = 0;
            let touchMoved = false;
            let showingOriginal = false;

            container.addEventListener('touchstart', (e) => {
                touchStartTime = Date.now();
                touchMoved = false;

                if (e.touches.length === 2) {
                    // Pinch zoom
                    initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    initialScale = state.zoom.scale;
                } else if (e.touches.length === 1 && state.zoom.scale > 1) {
                    // Pan
                    lastTouchX = e.touches[0].pageX;
                    lastTouchY = e.touches[0].pageY;
                }
            });

            container.addEventListener('touchmove', (e) => {
                touchMoved = true;

                if (e.touches.length === 2) {
                    // Pinch zoom
                    e.preventDefault();
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const scale = initialScale * (currentDistance / initialDistance);
                    state.zoom.scale = Math.max(1, Math.min(4, scale));
                    renderPreview();
                } else if (e.touches.length === 1 && state.zoom.scale > 1) {
                    // Pan
                    e.preventDefault();
                    const dx = e.touches[0].pageX - lastTouchX;
                    const dy = e.touches[0].pageY - lastTouchY;
                    state.zoom.translateX += dx;
                    state.zoom.translateY += dy;
                    lastTouchX = e.touches[0].pageX;
                    lastTouchY = e.touches[0].pageY;
                    renderPreview();
                }
            });

            container.addEventListener('touchend', (e) => {
                const touchDuration = Date.now() - touchStartTime;

                // Short tap without movement = toggle original/edited
                if (!touchMoved && touchDuration < 200 && e.touches.length === 0 && state.zoom.scale === 1) {
                    toggleOriginal();
                }
            });

            // Double tap to reset zoom
            let lastTap = 0;
            container.addEventListener('dblclick', (e) => {
                state.zoom = { scale: 1, translateX: 0, translateY: 0 };
                renderPreview();
            });

            // Toggle original/edited view
            function toggleOriginal() {
                if (showingOriginal) return; // Already showing original

                showingOriginal = true;
                const photo = state.photos[state.currentIndex];

                // Show original
                const canvas = document.getElementById('previewCanvas');
                const ctx = canvas.getContext('2d');
                ctx.putImageData(photo.original, 0, 0);

                // Show pulsing indicator
                const indicator = document.getElementById('statusIndicator');
                indicator.classList.add('active');

                // After 3 pulses (1.5 seconds), switch back to edited
                setTimeout(() => {
                    indicator.classList.remove('active');
                    showingOriginal = false;

                    // Show edited version
                    const imageData = photo.processed || photo.original;
                    ctx.putImageData(imageData, 0, 0);
                }, 1500);
            }
        }

        // ========================================
        // IMAGE PROCESSING
        // ========================================

        function processImage(imageData, settings) {
            const output = new ImageData(
                new Uint8ClampedArray(imageData.data),
                imageData.width,
                imageData.height
            );

            // Apply color mode (film stock)
            switch (settings.colorMode) {
                case 'portra400':
                    applyPortra400(output);
                    break;
                case 'trix400':
                    applyTriX(output);
                    break;
                case 'ektachrome':
                    applyEktachrome(output);
                    break;
            }

            // Apply soft mode (tone curves)
            switch (settings.softMode) {
                case 'STANDARD':
                    // No adjustment
                    break;
                case 'SOFT':
                    applySoftContrast(output);
                    break;
                case 'SHADOW SOFT':
                    applyShadowSoft(output);
                    break;
                case 'HIGHLIGHT SOFT':
                    applyHighlightSoft(output);
                    break;
            }

            // Apply bloom (0-20 range)
            if (settings.bloom > 0) {
                applyBloom(output, settings.bloom);
            }

            // Apply grain (0-10 range, film-specific)
            if (settings.grain > 0) {
                applyRealisticGrain(output, settings.grain, settings.colorMode);
            }

            return output;
        }

        function applyPortra400(imageData) {
            // Kodak Portra 400: Warm, natural skin tones, medium contrast
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // Color shift: warmth +8, red bias, desaturated blues
                r = r * 1.08 + 8;  // Red bias + warmth
                g = g * 1.02;      // Slight green enhancement
                b = b * 0.95;      // Reduce blue (warmer)

                // Overall saturation boost
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                r = gray + 1.15 * (r - gray);
                g = gray + 1.15 * (g - gray);
                b = gray + 1.15 * (b - gray);

                // Shadow lift (+5) and slight highlight compression (-2)
                const lum = (r + g + b) / 3;
                if (lum < 128) {
                    const lift = 5 * (1 - lum / 128);
                    r += lift;
                    g += lift;
                    b += lift;
                } else {
                    const compress = 2 * ((lum - 128) / 127);
                    r -= compress;
                    g -= compress;
                    b -= compress;
                }

                data[i] = Math.min(255, Math.max(0, r));
                data[i + 1] = Math.min(255, Math.max(0, g));
                data[i + 2] = Math.min(255, Math.max(0, b));
            }
        }

        function applyTriX(imageData) {
            // Kodak Tri-X 400: High contrast B&W, iconic street photography film
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                // Convert to grayscale (standard luminance formula)
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];

                // Contrast +25 and gamma 0.85 for punchy B&W look
                let val = gray / 255;
                val = Math.pow(val, 0.85); // Gamma adjustment for contrast

                // Apply contrast boost
                val = ((val - 0.5) * 1.25) + 0.5; // +25% contrast
                val = Math.max(0, Math.min(1, val)); // Clamp

                const finalGray = val * 255;

                data[i] = finalGray;
                data[i + 1] = finalGray;
                data[i + 2] = finalGray;
            }
        }

        function applyEktachrome(imageData) {
            // Kodak Ektachrome E100: Vivid saturated slide film, punchy colors
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // Color shifts: Red +5, Blue +8, Green 0
                r = r + 5;
                b = b + 8;

                // High saturation (1.4x)
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                r = gray + 1.4 * (r - gray);
                g = gray + 1.4 * (g - gray);
                b = gray + 1.4 * (b - gray);

                // Contrast +15
                r = ((r / 255 - 0.5) * 1.15 + 0.5) * 255;
                g = ((g / 255 - 0.5) * 1.15 + 0.5) * 255;
                b = ((b / 255 - 0.5) * 1.15 + 0.5) * 255;

                data[i] = Math.min(255, Math.max(0, r));
                data[i + 1] = Math.min(255, Math.max(0, g));
                data[i + 2] = Math.min(255, Math.max(0, b));
            }
        }

        function applySoftContrast(imageData) {
            // SOFT: Compress both shadows and highlights (S-curve flatten)
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                for (let c = 0; c < 3; c++) {
                    let val = data[i + c] / 255;

                    // Softer S-curve: reduce contrast globally
                    // Use a gentler power curve
                    if (val < 0.5) {
                        val = 0.5 * Math.pow(val * 2, 1.2);
                    } else {
                        val = 1 - 0.5 * Math.pow((1 - val) * 2, 1.2);
                    }

                    data[i + c] = Math.min(255, val * 255);
                }
            }
        }

        function applyShadowSoft(imageData) {
            // SHADOW SOFT: Lift shadows only, maintain highlights
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                for (let c = 0; c < 3; c++) {
                    let val = data[i + c] / 255;

                    // Apply lift to shadows (below 0.5)
                    if (val < 0.5) {
                        // Lift shadows using a curve
                        val = val + (0.5 - val) * 0.25; // 25% lift
                    }
                    // Highlights unchanged

                    data[i + c] = Math.min(255, val * 255);
                }
            }
        }

        function applyHighlightSoft(imageData) {
            // HIGHLIGHT SOFT: Compress highlights only, maintain shadows
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                for (let c = 0; c < 3; c++) {
                    let val = data[i + c] / 255;

                    // Apply compression to highlights (above 0.5)
                    if (val > 0.5) {
                        // Compress highlights using a curve
                        val = 0.5 + (val - 0.5) * 0.75; // 25% compression
                    }
                    // Shadows unchanged

                    data[i + c] = Math.min(255, val * 255);
                }
            }
        }

        function applyBloom(imageData, intensity) {
            // Bloom effect: Extract highlights, blur, and blend back
            // Intensity 0-20 maps to radius 0-10
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const radius = Math.floor(intensity / 2); // 0-10 pixel radius

            if (radius === 0) return;

            // Extract highlights (threshold ~200)
            const highlights = new Uint8ClampedArray(data.length);
            for (let i = 0; i < data.length; i += 4) {
                const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
                if (lum > 200) {
                    const factor = (lum - 200) / 55; // 0-1 for 200-255
                    highlights[i] = data[i] * factor;
                    highlights[i + 1] = data[i + 1] * factor;
                    highlights[i + 2] = data[i + 2] * factor;
                    highlights[i + 3] = 255;
                }
            }

            // Simple box blur on highlights (fast approximation)
            const blurred = boxBlur(highlights, width, height, radius);

            // Blend blurred highlights back (additive)
            const blendStrength = 0.6; // 60% blend
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] + blurred[i] * blendStrength);
                data[i + 1] = Math.min(255, data[i + 1] + blurred[i + 1] * blendStrength);
                data[i + 2] = Math.min(255, data[i + 2] + blurred[i + 2] * blendStrength);
            }
        }

        function boxBlur(data, width, height, radius) {
            // Fast box blur approximation
            const output = new Uint8ClampedArray(data.length);
            const diameter = radius * 2 + 1;
            const divisor = diameter * diameter;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0, count = 0;

                    // Sample box around pixel
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;

                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const idx = (ny * width + nx) * 4;
                                r += data[idx];
                                g += data[idx + 1];
                                b += data[idx + 2];
                                count++;
                            }
                        }
                    }

                    const idx = (y * width + x) * 4;
                    output[idx] = r / count;
                    output[idx + 1] = g / count;
                    output[idx + 2] = b / count;
                    output[idx + 3] = 255;
                }
            }

            return output;
        }

        function applyRealisticGrain(imageData, intensity, filmStock) {
            const data = imageData.data;

            // Film-specific grain characteristics
            let grainSize, grainStrength, lumWeighting;

            if (filmStock === 'portra400') {
                // Portra 400: Medium grain, low visibility, smooth
                grainSize = 1.5;
                grainStrength = intensity * 12; // Scale 0-10 to 0-120 (much more visible)
                lumWeighting = 'shadows'; // More grain in shadows
            } else if (filmStock === 'trix400') {
                // Tri-X 400: Large chunky grain, high contrast, very visible
                grainSize = 2.5;
                grainStrength = intensity * 18; // Scale 0-10 to 0-180 (very heavy)
                lumWeighting = 'midtones'; // More grain in midtones for B&W
            } else if (filmStock === 'ektachrome') {
                // Ektachrome: Very fine grain, minimal, tight
                grainSize = 1.0;
                grainStrength = intensity * 8; // Scale 0-10 to 0-80 (more visible)
                lumWeighting = 'uniform'; // Even distribution
            }

            for (let i = 0; i < data.length; i += 4) {
                const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
                const lumNorm = lum / 255;

                // Calculate luminance factor based on film
                let lumFactor = 1;
                if (lumWeighting === 'shadows') {
                    // More grain in shadows
                    lumFactor = 1.5 - lumNorm;
                } else if (lumWeighting === 'midtones') {
                    // More grain in midtones (peak at 50% gray)
                    lumFactor = 1 - Math.abs(lumNorm - 0.5) * 2;
                } else {
                    // Uniform
                    lumFactor = 1;
                }

                // Calculate final grain amount
                const grainAmount = grainStrength * lumFactor * grainSize;

                // Apply grain
                if (filmStock === 'trix400') {
                    // B&W: Monochrome grain
                    const noise = (Math.random() - 0.5) * grainAmount;
                    data[i] = Math.min(255, Math.max(0, data[i] + noise));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
                } else {
                    // Color: Chromatic grain (different per channel)
                    const noiseR = (Math.random() - 0.5) * grainAmount;
                    const noiseG = (Math.random() - 0.5) * grainAmount * 0.9;
                    const noiseB = (Math.random() - 0.5) * grainAmount * 1.1;

                    data[i] = Math.min(255, Math.max(0, data[i] + noiseR));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noiseG));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noiseB));
                }
            }
        }

        function processCurrentPhoto() {
            const photo = state.photos[state.currentIndex];
            photo.processed = processImage(photo.original, photo.settings);
            renderPreview();
        }

        // ========================================
        // EVENT HANDLERS
        // ========================================

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            if (confirm('RETURN TO UPLOAD?')) {
                location.reload();
            }
        });

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (state.currentIndex > 0) {
                // Copy current settings to previous photo
                const currentSettings = { ...state.photos[state.currentIndex].settings };

                state.currentIndex--;

                // Apply settings to previous photo if it hasn't been edited yet
                if (!state.photos[state.currentIndex].processed) {
                    state.photos[state.currentIndex].settings = currentSettings;
                    processCurrentPhoto();
                }

                renderPreview();
                updateUI();
                haptic('light');
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (state.currentIndex < state.photos.length - 1) {
                // Copy current settings to next photo
                const currentSettings = { ...state.photos[state.currentIndex].settings };

                state.currentIndex++;

                // Auto-apply settings to next photo
                state.photos[state.currentIndex].settings = currentSettings;
                processCurrentPhoto();

                renderPreview();
                updateUI();
                haptic('light');
            }
        });

        // COLOR button - opens film stock menu
        document.getElementById('colorBtn').addEventListener('click', () => {
            if (state.activeControl === 'color') {
                state.activeControl = null; // Close if already open
            } else {
                state.activeControl = 'color'; // Open menu
            }
            updateUI();
            haptic('light');
        });

        // SOFT button - cycles through tone adjustments
        document.getElementById('softBtn').addEventListener('click', () => {
            const softModes = ['STANDARD', 'SOFT', 'SHADOW SOFT', 'HIGHLIGHT SOFT'];
            const currentIndex = softModes.indexOf(state.photos[state.currentIndex].settings.softMode);
            const nextIndex = (currentIndex + 1) % softModes.length;

            state.photos[state.currentIndex].settings.softMode = softModes[nextIndex];
            updateUI();
            processCurrentPhoto();
            haptic('light');
        });

        // BLOOM button - opens bloom controls
        document.getElementById('bloomBtn').addEventListener('click', () => {
            if (state.activeControl === 'bloom') {
                state.activeControl = null; // Close if already open
            } else {
                state.activeControl = 'bloom'; // Open controls
            }
            updateUI();
            haptic('light');
        });

        // GRAIN button - opens grain controls
        document.getElementById('grainBtn').addEventListener('click', () => {
            if (state.activeControl === 'grain') {
                state.activeControl = null; // Close if already open
            } else {
                state.activeControl = 'grain'; // Open controls
            }
            updateUI();
            haptic('light');
        });

        // Color mode menu options
        document.querySelectorAll('[data-colormode]').forEach(btn => {
            btn.addEventListener('click', () => {
                state.photos[state.currentIndex].settings.colorMode = btn.dataset.colormode;
                state.activeControl = null; // Close menu after selection
                updateUI();
                processCurrentPhoto();
                haptic('medium');
            });
        });

        // Slider buttons with hold-to-slide
        let holdInterval = null;
        let holdTimeout = null;

        document.querySelectorAll('.slider-btn').forEach(btn => {
            const control = btn.dataset.control;
            const dir = btn.dataset.dir === '+' ? 1 : -1;

            // Click/tap
            btn.addEventListener('click', () => {
                adjustControl(control, dir);
            });

            // Hold to slide
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();

                // Single adjustment
                adjustControl(control, dir);

                // Start holding after 300ms
                holdTimeout = setTimeout(() => {
                    holdInterval = setInterval(() => {
                        adjustControl(control, dir * 2); // Faster when holding
                    }, 100);
                }, 300);
            });

            btn.addEventListener('touchend', () => {
                clearTimeout(holdTimeout);
                clearInterval(holdInterval);
            });

            btn.addEventListener('touchcancel', () => {
                clearTimeout(holdTimeout);
                clearInterval(holdInterval);
            });
        });

        function adjustControl(control, dir) {
            const settings = state.photos[state.currentIndex].settings;

            if (control === 'bloom') {
                // Bloom: 0-20 range, increment by 1
                settings.bloom = Math.max(0, Math.min(20, settings.bloom + dir));
            } else if (control === 'grain') {
                // Grain: 0-10 range, increment by 1
                settings.grain = Math.max(0, Math.min(10, settings.grain + dir));
            }

            updateUI();
            processCurrentPhoto();
            haptic('light');
        }

        // Save button
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const photo = state.photos[state.currentIndex];
            if (!photo.processed) {
                processCurrentPhoto();
            }

            const canvas = document.createElement('canvas');
            const imageData = photo.processed || photo.original;
            canvas.width = imageData.width;
            canvas.height = imageData.height;
            const ctx = canvas.getContext('2d');
            ctx.putImageData(imageData, 0, 0);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], photo.filename, { type: 'image/jpeg' });

                if (navigator.share && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file] });
                        haptic('success');
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            downloadFile(blob, photo.filename);
                        }
                    }
                } else {
                    downloadFile(blob, photo.filename);
                }
            }, 'image/jpeg', 0.95);
        });

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
